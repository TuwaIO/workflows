<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Space Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#103254"/>
      <stop offset="55%" stop-color="#0a1b2c"/>
      <stop offset="100%" stop-color="#06121e"/>
    </radialGradient>

    <!-- Cyan Neon Linear Gradient with userSpaceOnUse to render all angles & axes -->
    <linearGradient id="cyanNeon" gradientUnits="userSpaceOnUse" x1="88" y1="64" x2="424" y2="448">
      <stop offset="0%" stop-color="#7cf3ff"/>
      <stop offset="100%" stop-color="#22c3e6"/>
    </linearGradient>

    <!-- Node Star Glow Gradient -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7cf3ff" stop-opacity="1"/>
      <stop offset="35%" stop-color="#22c3e6" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#00e5ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Center Node Radiant Core Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="25%" stop-color="#7cf3ff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#00b4d8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0077b6" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Neon Bloom Filter -->
    <filter id="neonBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Container Squircle / Rounded Rect rx=112 (~22%) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="112" fill="none" stroke="#22c3e6" stroke-width="2" stroke-opacity="0.2"/>

  <!-- Starry Sky Background (Ambient micro-stars) -->
  <g id="starfield">
    <circle cx="52" cy="78" r="1.8" fill="#7cf3ff" opacity="0.45"/>
    <circle cx="74" cy="96" r="1.2" fill="#7cf3ff" opacity="0.35"/>
    <circle cx="410" cy="68" r="2.0" fill="#7cf3ff" opacity="0.5"/>
    <circle cx="450" cy="92" r="1.4" fill="#7cf3ff" opacity="0.35"/>
    <circle cx="178" cy="48" r="1.6" fill="#7cf3ff" opacity="0.4"/>
    <circle cx="336" cy="42" r="2.2" fill="#7cf3ff" opacity="0.55"/>
    <circle cx="48" cy="220" r="1.5" fill="#7cf3ff" opacity="0.35"/>
    <circle cx="48" cy="280" r="2.0" fill="#7cf3ff" opacity="0.5"/>
    <circle cx="464" cy="218" r="1.8" fill="#7cf3ff" opacity="0.45"/>
    <circle cx="460" cy="290" r="1.3" fill="#7cf3ff" opacity="0.3"/>
    <circle cx="64" cy="432" r="2.2" fill="#7cf3ff" opacity="0.5"/>
    <circle cx="428" cy="438" r="1.9" fill="#7cf3ff" opacity="0.45"/>
    <circle cx="168" cy="466" r="1.4" fill="#7cf3ff" opacity="0.35"/>
    <circle cx="346" cy="468" r="2.0" fill="#7cf3ff" opacity="0.5"/>
    <circle cx="480" cy="410" r="1.2" fill="#7cf3ff" opacity="0.3"/>
    <circle cx="32" cy="390" r="1.5" fill="#7cf3ff" opacity="0.4"/>
    <!-- Star Sparkles -->
    <path d="M336 42 L337.5 40.5 L339 42 L337.5 43.5 Z" fill="#ffffff" opacity="0.8"/>
    <path d="M48 280 L49.5 278.5 L51 280 L49.5 281.5 Z" fill="#ffffff" opacity="0.7"/>
    <path d="M428 438 L429.5 436.5 L431 438 L429.5 439.5 Z" fill="#ffffff" opacity="0.7"/>
  </g>

  <!-- Constellation Network Depth Edges (Secondary 3D Facets) -->
  <g id="secondary-edges" stroke="#38bdf8" stroke-width="2.2" stroke-opacity="0.45" stroke-dasharray="6 4" stroke-linecap="round">
    <line x1="134.0" y1="256.0" x2="256.0" y2="64.0"/>
    <line x1="134.0" y1="256.0" x2="256.0" y2="448.0"/>
    <line x1="134.0" y1="256.0" x2="88.0" y2="160.0"/>
    <line x1="134.0" y1="256.0" x2="88.0" y2="352.0"/>
    <line x1="326.0" y1="150.0" x2="256.0" y2="64.0"/>
    <line x1="326.0" y1="150.0" x2="424.0" y2="352.0"/>
    <line x1="326.0" y1="362.0" x2="256.0" y2="448.0"/>
    <line x1="326.0" y1="362.0" x2="424.0" y2="160.0"/>
  </g>

  <!-- Constellation Primary Edges (Foreground Neon) -->
  <g id="primary-edges" stroke="url(#cyanNeon)" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonBloom)">
    <line x1="256.0" y1="64.0" x2="88.0" y2="160.0"/>
    <line x1="88.0" y1="160.0" x2="88.0" y2="352.0"/>
    <line x1="88.0" y1="352.0" x2="256.0" y2="448.0"/>
    <line x1="256.0" y1="448.0" x2="424.0" y2="352.0"/>
    <line x1="424.0" y1="352.0" x2="424.0" y2="160.0"/>
    <line x1="424.0" y1="160.0" x2="256.0" y2="64.0"/>
    <line x1="256.0" y1="64.0" x2="256.0" y2="256.0"/>
    <line x1="256.0" y1="256.0" x2="256.0" y2="448.0"/>
    <line x1="256.0" y1="256.0" x2="88.0" y2="160.0"/>
    <line x1="256.0" y1="256.0" x2="424.0" y2="160.0"/>
    <line x1="256.0" y1="256.0" x2="88.0" y2="352.0"/>
    <line x1="256.0" y1="256.0" x2="424.0" y2="352.0"/>
    <line x1="88.0" y1="160.0" x2="326.0" y2="150.0"/>
    <line x1="326.0" y1="150.0" x2="424.0" y2="160.0"/>
    <line x1="88.0" y1="352.0" x2="326.0" y2="362.0"/>
    <line x1="326.0" y1="362.0" x2="424.0" y2="352.0"/>
  </g>

  <!-- Glowing Nodes / Stars -->
  <g id="nodes">
    <circle cx="256.0" cy="64.0" r="36.0" fill="url(#starGlow)" opacity="0.6"/>
    <circle cx="88.0" cy="160.0" r="33.6" fill="url(#starGlow)" opacity="0.6"/>
    <circle cx="326.0" cy="150.0" r="28.8" fill="url(#starGlow)" opacity="0.6"/>
    <circle cx="424.0" cy="160.0" r="33.6" fill="url(#starGlow)" opacity="0.6"/>
    <circle cx="134.0" cy="256.0" r="28.8" fill="url(#starGlow)" opacity="0.6"/>
    <circle cx="256.0" cy="256.0" r="40.8" fill="url(#starGlow)" opacity="0.6"/>
    <circle cx="88.0" cy="352.0" r="33.6" fill="url(#starGlow)" opacity="0.6"/>
    <circle cx="326.0" cy="362.0" r="28.8" fill="url(#starGlow)" opacity="0.6"/>
    <circle cx="424.0" cy="352.0" r="33.6" fill="url(#starGlow)" opacity="0.6"/>
    <circle cx="256.0" cy="448.0" r="36.0" fill="url(#starGlow)" opacity="0.6"/>
    <circle cx="256.0" cy="256.0" r="48" fill="url(#centerGlow)" opacity="0.45"/>
    <circle cx="256.0" cy="64.0" r="15" fill="url(#cyanNeon)" filter="url(#neonBloom)"/>
    <circle cx="256.0" cy="64.0" r="6.3" fill="#ffffff" opacity="0.95"/>
    <circle cx="88.0" cy="160.0" r="14" fill="url(#cyanNeon)" filter="url(#neonBloom)"/>
    <circle cx="88.0" cy="160.0" r="5.9" fill="#ffffff" opacity="0.95"/>
    <circle cx="326.0" cy="150.0" r="12" fill="url(#cyanNeon)" filter="url(#neonBloom)"/>
    <circle cx="326.0" cy="150.0" r="5.0" fill="#ffffff" opacity="0.95"/>
    <circle cx="424.0" cy="160.0" r="14" fill="url(#cyanNeon)" filter="url(#neonBloom)"/>
    <circle cx="424.0" cy="160.0" r="5.9" fill="#ffffff" opacity="0.95"/>
    <circle cx="134.0" cy="256.0" r="12" fill="url(#cyanNeon)" filter="url(#neonBloom)"/>
    <circle cx="134.0" cy="256.0" r="5.0" fill="#ffffff" opacity="0.95"/>
    <circle cx="256.0" cy="256.0" r="17" fill="url(#cyanNeon)" filter="url(#neonBloom)"/>
    <circle cx="256.0" cy="256.0" r="7.1" fill="#ffffff" opacity="0.95"/>
    <circle cx="88.0" cy="352.0" r="14" fill="url(#cyanNeon)" filter="url(#neonBloom)"/>
    <circle cx="88.0" cy="352.0" r="5.9" fill="#ffffff" opacity="0.95"/>
    <circle cx="326.0" cy="362.0" r="12" fill="url(#cyanNeon)" filter="url(#neonBloom)"/>
    <circle cx="326.0" cy="362.0" r="5.0" fill="#ffffff" opacity="0.95"/>
    <circle cx="424.0" cy="352.0" r="14" fill="url(#cyanNeon)" filter="url(#neonBloom)"/>
    <circle cx="424.0" cy="352.0" r="5.9" fill="#ffffff" opacity="0.95"/>
    <circle cx="256.0" cy="448.0" r="15" fill="url(#cyanNeon)" filter="url(#neonBloom)"/>
    <circle cx="256.0" cy="448.0" r="6.3" fill="#ffffff" opacity="0.95"/>
    <!-- Center Celestial Sparkle -->
    <path d="M256.0 230.0 Q256.0 256.0 282.0 256.0 Q256.0 256.0 256.0 282.0 Q256.0 256.0 230.0 256.0 Q256.0 256.0 256.0 230.0 Z" fill="#ffffff" opacity="0.75"/>
    <circle cx="256.0" cy="256.0" r="3" fill="#ffffff"/>
  </g>
</svg>
