name: 'Reusable: Alpha Release'

on:
  workflow_call:

jobs:
  release:
    name: Publish Alpha
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    env:
      ACTIONS_RUNNER_FORCE_NODE24: 'false'
      NODE_NO_WARNINGS: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      # A merge, not a rebase: feature branches take main in with merge commits, and a rebase drops them and replays
      # every branch commit on main again, conflicts included. A branch that already contains main stays as it is;
      # one behind main gets a merge commit on top of the remote branch, which semantic-release can still publish from
      # (its push check passes; it pushes only the tag).
      - name: Synchronize branch with main
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git pull origin main --no-rebase --no-edit

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      # semantic-release 26 refuses to run on Node older than 26.13. Only this release job runs on Node 26: the
      # repositories' own CI still builds and tests on Node 24.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install GitHub CLI
        run: |
          type -p curl >/dev/null || (sudo apt-get update && sudo apt-get install curl -y)
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg \
          && sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg \
          && echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null \
          && sudo apt-get update \
          && sudo apt-get install gh -y

      - name: Authenticate with GitHub CLI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      # semantic-release 26 puts its default plugins (npm, github) over the plugins of a config given with --extends, so
      # the alpha config's plugins never ran: no alpha reached npm (the workspace root is private), and the github plugin
      # published a GitHub release of every alpha branch and commented on every pull request since the first commit (a
      # new branch has no release of its own to count from), a notification each. The alpha config is the repository's
      # own config here, which wins over the defaults; a repository with a release config of its own stops the job
      - name: Publish Alpha Version to NPM
        run: |
          for config in .releaserc .releaserc.json .releaserc.yaml .releaserc.yml .releaserc.js .releaserc.cjs \
            .releaserc.mjs release.config.js release.config.cjs release.config.mjs; do
            if [ -e "$config" ]; then
              echo "::error::$config exists: the alpha release runs with alpha.release.config.js alone"
              exit 1
            fi
          done
          if node -e "process.exit(require('./package.json').release ? 0 : 1)"; then
            echo "::error::package.json has a release key: the alpha release runs with alpha.release.config.js alone"
            exit 1
          fi
          cp alpha.release.config.js release.config.js
          pnpm semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true